<style>
:root{
  --paper:#FFFFFF;
  --ink:#16202A;
  --muted:#5F6B76;
  --line:#E4E8EC;
  --tint:#F3F6F5;
  --accent:#0E7C66;
  --accent-soft:#E3F2EE;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --wrap:1120px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(80px + env(safe-area-inset-top,0px))}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
[hidden]{display:none!important}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 clamp(20px,5vw,40px)}

/* ---------- nav ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .3s}
.nav.scrolled{border-bottom-color:var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{font-family:var(--display);font-weight:800;font-size:1.2rem;text-decoration:none;letter-spacing:-.01em}
.nav ul{display:flex;gap:6px;list-style:none;padding:0}
.nav ul a{display:block;padding:8px 14px;border-radius:999px;text-decoration:none;font-size:.95rem;color:var(--muted);transition:color .2s,background .2s}
.nav ul a:hover{color:var(--ink)}
.nav ul a.active{color:var(--accent);background:var(--accent-soft)}
@media (max-width:680px){.nav ul li:not(:last-child){display:none}}

/* ---------- hero ---------- */
.hero{padding:clamp(64px,12vw,140px) 0 clamp(56px,9vw,110px)}
.hero-grid{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:end}
.hello{color:var(--muted);font-size:1.05rem;margin-bottom:14px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(3rem,11vw,8.5rem);line-height:.92;letter-spacing:-.04em}
.hero h1 .word{display:inline-block;white-space:nowrap}
.hero h1 .ch{display:inline-block;transform:translateY(105%);opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
.hero-role{font-family:var(--display);font-size:clamp(1.3rem,3vw,2rem);font-weight:400;color:var(--accent);margin-top:18px;opacity:0;animation:fade .7s ease forwards}
.hero-intro{max-width:56ch;color:var(--muted);margin-top:18px;opacity:0;animation:fade .7s ease forwards}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px;opacity:0;animation:fade .7s ease forwards}
.photo{width:clamp(120px,18vw,200px);aspect-ratio:1;border-radius:50%;object-fit:cover;opacity:0;animation:pop .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85) rotate(-6deg)}to{opacity:1;transform:none}}
@media (max-width:680px){.hero-grid{grid-template-columns:1fr}.photo{order:-1}}

.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:500;text-decoration:none;font-size:1rem;border:1.5px solid var(--ink);transition:transform .2s,background .2s,color .2s;cursor:pointer;font-family:inherit;background:none;color:var(--ink)}
.btn:hover{transform:translateY(-2px)}
.btn.solid{background:var(--ink);color:#fff}
.btn.solid:hover{background:var(--accent);border-color:var(--accent)}

/* ---------- sections ---------- */
section{padding:clamp(56px,9vw,100px) 0}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:20px;margin-bottom:36px}
h2{font-family:var(--display);font-weight:600;font-size:clamp(2rem,5vw,3.2rem);letter-spacing:-.03em;line-height:1.05}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}

/* ---------- projects ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{font:inherit;font-size:.92rem;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;transition:all .2s}
.filters button:hover{color:var(--ink);border-color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:clamp(20px,3vw,32px)}
.project{display:flex;flex-direction:column}
.project[hidden]{display:none}
.cover{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:var(--tint)}
.cover img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.cover .gen{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(4rem,9vw,6rem);letter-spacing:-.05em;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.project:hover .cover img,.project:hover .cover .gen{transform:scale(1.05)}
.cover .cat{position:absolute;top:12px;left:12px;background:#fff;font-size:.8rem;padding:4px 10px;border-radius:999px;font-weight:500}
.project h3{font-family:var(--display);font-weight:600;font-size:1.4rem;letter-spacing:-.01em;margin-top:18px}
.project p{color:var(--muted);margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tags span{font-size:.82rem;padding:3px 10px;border-radius:6px;background:var(--tint);color:var(--muted)}
.links{display:flex;gap:18px;margin-top:14px}
.links a{font-weight:500;font-size:.95rem;text-decoration:none;border-bottom:1.5px solid var(--line);transition:border-color .2s,color .2s}
.links a:hover{color:var(--accent);border-color:var(--accent)}

/* ---------- about ---------- */
#about{background:var(--tint)}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,6vw,80px)}
.about-text{font-size:clamp(1.1rem,2vw,1.3rem);line-height:1.65;max-width:60ch}
.skills{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.skills span{background:#fff;border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-weight:500;font-size:.95rem}
.about-grid h3{font-family:var(--display);font-weight:600;font-size:1.2rem;margin-bottom:14px}
@media (max-width:760px){.about-grid{grid-template-columns:1fr}}

/* ---------- experience ---------- */
.timeline{list-style:none;padding:0;border-top:1px solid var(--line)}
.timeline li{display:grid;grid-template-columns:170px 1fr;gap:24px;padding:26px 0;border-bottom:1px solid var(--line)}
.timeline .period{color:var(--accent);font-weight:500}
.timeline h3{font-family:var(--display);font-weight:600;font-size:1.25rem}
.timeline .place{color:var(--muted);font-size:.95rem}
.timeline p{margin-top:6px;max-width:62ch}
@media (max-width:600px){.timeline li{grid-template-columns:1fr;gap:6px}}

/* ---------- contact ---------- */
#contact{text-align:left}
.big-mail{display:inline-block;font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,7vw,5rem);letter-spacing:-.04em;line-height:1.05;text-decoration:none;word-break:break-word;background:linear-gradient(var(--accent),var(--accent)) 0 100%/0 4px no-repeat;transition:background-size .5s cubic-bezier(.2,.8,.2,1),color .3s}
.big-mail:hover{background-size:100% 4px;color:var(--accent)}
.contact-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px;align-items:center}
.socials{display:flex;flex-wrap:wrap;gap:22px;margin-top:40px}
.socials a{text-decoration:none;font-weight:500;color:var(--muted);transition:color .2s}
.socials a:hover{color:var(--ink)}
.toast{color:var(--accent);font-weight:500;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}

footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
footer a{text-decoration:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>

<nav class="nav" id="nav">
  <div class="wrap">
    <a href="#top" class="brand" id="brand"></a>
    <ul>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#experience">Experience</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </div>
</nav>

<main id="top">
  <header class="hero">
    <div class="wrap hero-grid">
      <div>
        <p class="hello" id="hello"></p>
        <h1 id="hero-name" aria-label=""></h1>
        <p class="hero-role" id="hero-role"></p>
        <p class="hero-intro" id="hero-intro"></p>
        <div class="hero-actions" id="hero-actions">
          <a href="#projects" class="btn solid">See my projects</a>
          <a href="#contact" class="btn">Contact me</a>
        </div>
      </div>
      <img class="photo" id="photo" alt="" hidden>
    </div>
  </header>

  <section id="projects">
    <div class="wrap">
      <div class="sec-head reveal">
        <h2>Projects</h2>
        <div class="filters" id="filters" role="group" aria-label="Filter projects"></div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section id="about">
    <div class="wrap about-grid reveal">
      <div>
        <h2 style="margin-bottom:22px">About me</h2>
        <p class="about-text" id="about-text"></p>
      </div>
      <div>
        <h3>What I work with</h3>
        <div class="skills" id="skills"></div>
      </div>
    </div>
  </section>

  <section id="experience">
    <div class="wrap">
      <h2 class="reveal" style="margin-bottom:32px">Experience &amp; education</h2>
      <ol class="timeline reveal" id="timeline"></ol>
    </div>
  </section>

  <section id="contact">
    <div class="wrap reveal">
      <h2 style="margin-bottom:18px">Have a project in mind? Let's talk.</h2>
      <a class="big-mail" id="big-mail"></a>
      <div class="contact-row">
        <button class="btn" id="copy">Copy email</button>
        <a class="btn" id="cv" target="_blank" rel="noopener" hidden>Download CV</a>
        <span class="toast" id="toast" role="status">Email copied</span>
      </div>
      <div class="socials" id="socials"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span id="copyright"></span>
    <a href="#top">Back to top</a>
  </div>
</footer>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  document.title = `${SITE.name} — ${SITE.role}`;
  $("brand").textContent = SITE.name;
  $("hello").textContent = `Hi, I'm based in ${SITE.location}`;

  /* hero name: letter-by-letter rise */
  const h1 = $("hero-name");
  h1.setAttribute("aria-label", SITE.name);
  let i = 0;
  SITE.name.split(" ").forEach((w, wi, arr) => {
    const word = document.createElement("span");
    word.className = "word";
    word.setAttribute("aria-hidden", "true");
    [...w].forEach(ch => {
      const s = document.createElement("span");
      s.className = "ch"; s.textContent = ch;
      s.style.animationDelay = (0.15 + i++ * 0.045) + "s";
      word.appendChild(s);
    });
    h1.appendChild(word);
    if (wi < arr.length - 1) h1.appendChild(document.createTextNode(" "));
  });
  const after = 0.15 + i * 0.045 + 0.25;
  $("hero-role").textContent = SITE.role;
  $("hero-role").style.animationDelay = after + "s";
  $("hero-intro").textContent = SITE.intro;
  $("hero-intro").style.animationDelay = (after + 0.12) + "s";
  $("hero-actions").style.animationDelay = (after + 0.24) + "s";
  if (SITE.photo) { const p = $("photo"); p.src = SITE.photo; p.alt = SITE.name; p.hidden = false; p.style.animationDelay = after + "s"; }

  /* projects */
  const palette = [["#E3F2EE","#0E7C66"],["#EAEFFC","#2F4FB5"],["#FDF0E4","#B4561A"],["#F2ECFA","#6B3FA0"],["#FCEBEE","#B23A55"],["#EDF5E1","#4E7A1E"]];
  const grid = $("grid");
  grid.innerHTML = SITE.projects.map((p, n) => {
    const [bg, fg] = palette[n % palette.length];
    const cover = p.image
      ? `<img src="${esc(p.image)}" alt="Screenshot of ${esc(p.title)}" loading="lazy">`
      : `<div class="gen" style="background:${bg};color:${fg}" aria-hidden="true">${esc(p.title.trim().charAt(0))}</div>`;
    const links = [
      p.live ? `<a href="${esc(p.live)}" target="_blank" rel="noopener">Live site</a>` : "",
      p.code ? `<a href="${esc(p.code)}" target="_blank" rel="noopener">Code</a>` : ""
    ].join("");
    return `<article class="project" data-cat="${esc(p.category)}">
      <div class="cover">${cover}<span class="cat">${esc(p.category)}</span></div>
      <h3>${esc(p.title)}</h3>
      <p>${esc(p.description)}</p>
      <div class="tags">${(p.tags||[]).map(t=>`<span>${esc(t)}</span>`).join("")}</div>
      <div class="links">${links}</div>
    </article>`;
  }).join("");

  const cats = ["All", ...new Set(SITE.projects.map(p => p.category))];
  const filters = $("filters");
  filters.innerHTML = cats.map(c => `<button type="button" aria-pressed="${c==="All"}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cards = [...grid.children];

  function showCards(list){
    list.forEach((el, k) => {
      if (reduce || !el.animate) return;
      el.animate(
        [{opacity:0, transform:"translateY(28px)"}, {opacity:1, transform:"none"}],
        {duration:600, delay:k*90, easing:"cubic-bezier(.2,.8,.2,1)", fill:"both"}
      );
    });
  }
  filters.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    filters.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    const c = b.dataset.cat;
    const visible = [];
    cards.forEach(el => { const on = c === "All" || el.dataset.cat === c; el.hidden = !on; if (on) visible.push(el); });
    showCards(visible);
  });

  /* about, skills, timeline */
  $("about-text").textContent = SITE.about;
  $("skills").innerHTML = SITE.skills.map(s => `<span>${esc(s)}</span>`).join("");
  $("timeline").innerHTML = SITE.experience.map(x => `<li>
      <span class="period">${esc(x.period)}</span>
      <div><h3>${esc(x.title)}</h3><span class="place">${esc(x.place)}</span><p>${esc(x.text)}</p></div>
    </li>`).join("");

  /* contact */
  const mail = $("big-mail");
  mail.textContent = SITE.email; mail.href = "mailto:" + SITE.email;
  $("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(SITE.email); }
    catch { const t = document.createElement("textarea"); t.value = SITE.email; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
    const toast = $("toast"); toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1800);
  });
  if (SITE.cv) { const cv = $("cv"); cv.href = SITE.cv; cv.hidden = false; }
  $("socials").innerHTML = SITE.socials.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join("");
  $("copyright").textContent = `© ${new Date().getFullYear()} ${SITE.name}`;

  /* scroll reveal + project cards entrance */
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
  }, {threshold:.15});
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));

  let gridShown = false;
  const gio = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting && !gridShown) { gridShown = true; showCards(cards); gio.disconnect(); }
  }, {threshold:.1});
  // cards stay hidden until the grid scrolls into view, then rise in one by one
  if (!reduce && Element.prototype.animate) { cards.forEach(c => c.style.opacity = 0); gio.observe(grid); }

  /* nav: border on scroll + active section */
  const nav = $("nav");
  addEventListener("scroll", () => nav.classList.toggle("scrolled", scrollY > 10), {passive:true});
  const links = [...document.querySelectorAll(".nav ul a")];
  const sio = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) links.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + en.target.id));
    });
  }, {rootMargin:"-45% 0px -50% 0px"});
  document.querySelectorAll("section[id]").forEach(s => sio.observe(s));
})();
</script>
</body>
</html>

<style>
:root{
  --paper:#FFFFFF;
  --ink:#1A1A1A;
  --muted:#62656B;
  --line:#E3E4E1;
  --stone:#E2E3DF;
  --stone-line:#C9CBC5;
  --accent:#0E7C66;
  --display:"Lexend Exa", "Segoe UI", system-ui, sans-serif;
  --body:"DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --wrap:1120px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(90px + env(safe-area-inset-top,0px))}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.65;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
img{max-width:100%;display:block}
[hidden]{display:none!important}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 clamp(20px,5vw,40px)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:background .35s,border-color .35s;padding-top:env(safe-area-inset-top,0px)}
.topbar.scrolled{border-bottom-color:var(--line)}
body.locked .topbar{background:var(--stone);border-bottom-color:var(--stone-line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:84px}
.brand{min-width:0;display:flex;align-items:center;gap:12px;text-decoration:none;font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase}
.brand .dot{width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.06);display:grid;place-items:center}
.brand .dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(.6);opacity:.6}}
.menu-btn{width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:#fff;cursor:pointer;display:grid;place-items:center;transition:transform .3s}
.menu-btn:hover{transform:scale(1.06)}
.menu-btn .bars{position:relative;width:20px;height:12px}
.menu-btn .bars span{position:absolute;left:0;width:100%;height:2px;background:#fff;border-radius:2px;transition:transform .4s cubic-bezier(.7,0,.2,1),top .4s cubic-bezier(.7,0,.2,1)}
.menu-btn .bars span:first-child{top:0}
.menu-btn .bars span:last-child{top:10px}
.menu-btn[aria-expanded="true"] .bars span:first-child{top:5px;transform:rotate(45deg)}
.menu-btn[aria-expanded="true"] .bars span:last-child{top:5px;transform:rotate(-45deg)}

/* ---------- full-screen menu ---------- */
.menu{position:fixed;inset:0;z-index:30;background:var(--stone);padding:calc(84px + env(safe-area-inset-top,0px) + 32px) 0 40px;overflow-y:auto;clip-path:inset(0 0 100% 0);visibility:hidden;transition:clip-path .6s cubic-bezier(.7,0,.2,1),visibility 0s .6s}
.menu.open{clip-path:inset(0 0 0 0);visibility:visible;transition:clip-path .6s cubic-bezier(.7,0,.2,1),visibility 0s}
.menu-label{font-family:var(--display);font-weight:700;font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;color:#4A4C48;margin-bottom:26px}
.menu ol{list-style:none;padding:0;border-top:1px solid var(--stone-line)}
.menu li{border-bottom:1px solid var(--stone-line);opacity:0;transform:translateY(24px);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.menu.open li{opacity:1;transform:none}
.menu a{display:flex;align-items:baseline;gap:clamp(28px,7vw,80px);padding:clamp(20px,3.2vw,30px) 4px;text-decoration:none}
.menu .num{font-family:var(--display);font-weight:600;font-size:.95rem;color:#55574F;min-width:2ch}
.menu .lbl{font-family:var(--display);font-weight:700;font-size:clamp(1.4rem,5vw,2.6rem);letter-spacing:.06em;text-transform:uppercase;transition:transform .35s cubic-bezier(.2,.8,.2,1),color .3s}
.menu a:hover .lbl,.menu a:focus-visible .lbl{transform:translateX(10px);color:var(--accent)}

/* ---------- hero ---------- */
.hero{padding:clamp(56px,11vw,130px) 0 clamp(56px,9vw,110px)}
.hero-grid{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:end}
.hello{color:var(--muted);margin-bottom:16px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(2.1rem,7.4vw,5.6rem);line-height:1.02;letter-spacing:-.01em;text-transform:uppercase}
.hero h1 .word{display:inline-block;white-space:nowrap;overflow:hidden;vertical-align:top;padding-bottom:.04em}
.hero h1 .ch{display:inline-block;transform:translateY(105%);animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
.hero-role{font-size:clamp(1.15rem,2.6vw,1.5rem);font-weight:500;color:var(--accent);margin-top:20px;opacity:0;animation:fade .7s ease forwards}
.hero-intro{max-width:56ch;color:var(--muted);margin-top:14px;opacity:0;animation:fade .7s ease forwards}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px;opacity:0;animation:fade .7s ease forwards}
.photo{width:clamp(130px,20vw,220px);aspect-ratio:1;border-radius:50%;object-fit:cover;opacity:0;animation:pop .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85) rotate(-6deg)}to{opacity:1;transform:none}}
@media (max-width:680px){.hero-grid{grid-template-columns:1fr}.photo{order:-1}}

.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:500;text-decoration:none;font-size:1rem;border:1.5px solid var(--ink);transition:transform .2s,background .2s,color .2s,border-color .2s;cursor:pointer;font-family:inherit;background:none;color:var(--ink)}
.btn:hover{transform:translateY(-2px)}
.btn.solid{background:var(--ink);color:#fff}
.btn.solid:hover{background:var(--accent);border-color:var(--accent)}

/* ---------- sections ---------- */
section.block{padding:clamp(60px,9vw,110px) 0;border-top:1px solid var(--line)}
section.block.tint{background:#F6F6F4}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:40px}
.sec-title{display:flex;align-items:baseline;gap:18px}
.sec-title .num{font-family:var(--display);font-weight:600;font-size:.95rem;color:var(--muted)}
h2{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,4.6vw,2.8rem);letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
h3{font-weight:700;font-size:1.2rem;line-height:1.35}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}

/* biography */
.bio-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(32px,6vw,80px)}
.bio-text p{font-size:clamp(1.1rem,2vw,1.28rem);max-width:58ch}
.bio-text p+p{margin-top:16px}
.timeline{list-style:none;padding:0;border-top:1px solid var(--line)}
.timeline li{padding:20px 0;border-bottom:1px solid var(--line)}
.timeline .period{color:var(--accent);font-weight:500;font-size:.95rem}
.timeline .place{color:var(--muted);font-size:.95rem}
.timeline p{margin-top:4px;font-size:.98rem}
@media (max-width:820px){.bio-grid{grid-template-columns:1fr}}

/* research */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:clamp(16px,2.5vw,28px)}
.r-card{border:1px solid var(--line);border-radius:16px;padding:28px;background:#fff;transition:border-color .3s,transform .3s}
.r-card:hover{border-color:var(--ink);transform:translateY(-4px)}
.r-card p{color:var(--muted);margin-top:8px}

/* publications */
.pubs{list-style:none;padding:0;border-top:1px solid var(--line)}
.pubs li{display:grid;grid-template-columns:110px 1fr;gap:24px;padding:26px 0;border-bottom:1px solid var(--line)}
.pubs .year{font-family:var(--display);font-weight:600;color:var(--muted)}
.pubs .authors{margin-top:4px}
.pubs .venue{color:var(--muted);font-style:italic}
@media (max-width:600px){.pubs li{grid-template-columns:1fr;gap:4px}}

/* projects */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{font:inherit;font-size:.92rem;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;transition:all .2s}
.filters button:hover{color:var(--ink);border-color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:clamp(20px,3vw,32px)}
.project{display:flex;flex-direction:column}
.cover{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:var(--stone)}
.cover img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.cover .gen{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:clamp(3.5rem,8vw,5.5rem);transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.project:hover .cover img,.project:hover .cover .gen{transform:scale(1.05)}
.cover .cat{position:absolute;top:12px;left:12px;background:#fff;font-size:.8rem;padding:4px 10px;border-radius:999px;font-weight:500}
.project h3{margin-top:18px;font-size:1.3rem}
.project p{color:var(--muted);margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tags span{font-size:.82rem;padding:3px 10px;border-radius:6px;background:#F1F2EF;color:var(--muted)}
.links{display:flex;gap:18px;margin-top:14px}
.links a{font-weight:500;font-size:.95rem;text-decoration:none;border-bottom:1.5px solid var(--line);transition:border-color .2s,color .2s}
.links a:hover{color:var(--accent);border-color:var(--accent)}

/* skills */
.skill-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:clamp(24px,4vw,48px)}
.skill-groups h3{font-size:1rem;color:var(--muted);font-weight:500;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips span{background:#fff;border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-weight:500;font-size:.95rem;transition:background .2s,color .2s,border-color .2s}
.chips span:hover{background:var(--ink);color:#fff;border-color:var(--ink)}

/* impact */
.impact{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:0;border-top:1px solid var(--line)}
.impact > div{padding:30px 24px 30px 0;border-bottom:1px solid var(--line)}
.impact .big{font-family:var(--display);font-weight:700;font-size:clamp(2.4rem,6vw,3.6rem);line-height:1;margin-bottom:14px}
.impact p{color:var(--muted);margin-top:6px}

/* contact */
.big-mail{display:inline-block;font-family:var(--display);font-weight:700;font-size:clamp(1.15rem,4.6vw,3.2rem);line-height:1.2;text-decoration:none;word-break:break-word;background:linear-gradient(var(--accent),var(--accent)) 0 100%/0 3px no-repeat;transition:background-size .5s cubic-bezier(.2,.8,.2,1),color .3s}
.big-mail:hover{background-size:100% 3px;color:var(--accent)}
.contact-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:24px;margin-top:40px;padding-top:28px;border-top:1px solid var(--line)}
.contact-info span{display:block;color:var(--muted);font-size:.9rem}
.contact-info a,.contact-info strong{font-weight:500;text-decoration:none}
.contact-info a:hover{color:var(--accent)}
.contact-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px;align-items:center}
.toast{color:var(--accent);font-weight:500;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}

footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
footer a{text-decoration:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important;transition-delay:0ms!important}
  html{scroll-behavior:auto}
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>

<header class="topbar" id="topbar">
  <div class="wrap">
    <a href="#home" class="brand"><span class="dot" aria-hidden="true"></span><span id="brand"></span></a>
    <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="menu" aria-label="Open menu">
      <span class="bars" aria-hidden="true"><span></span><span></span></span>
    </button>
  </div>
</header>

<nav class="menu" id="menu" aria-label="Main menu">
  <div class="wrap">
    <p class="menu-label">Menu</p>
    <ol id="menu-list"></ol>
  </div>
</nav>

<main>
  <section id="home" class="hero">
    <div class="wrap hero-grid">
      <div>
        <p class="hello" id="hello"></p>
        <h1 id="hero-name"></h1>
        <p class="hero-role" id="hero-role"></p>
        <p class="hero-intro" id="hero-intro"></p>
        <div class="hero-actions" id="hero-actions">
          <a href="#projects" class="btn solid">See my work</a>
          <a href="#contact" class="btn">Contact me</a>
        </div>
      </div>
      <img class="photo" id="photo" alt="" hidden>
    </div>
  </section>

  <section id="biography" class="block">
    <div class="wrap">
      <div class="sec-head reveal"><div class="sec-title"><span class="num"></span><h2>Biography</h2></div></div>
      <div class="bio-grid reveal">
        <div class="bio-text" id="bio-text"></div>
        <ol class="timeline" id="timeline"></ol>
      </div>
    </div>
  </section>

  <section id="research" class="block tint">
    <div class="wrap">
      <div class="sec-head reveal"><div class="sec-title"><span class="num"></span><h2>Research</h2></div></div>
      <div class="cards reveal" id="research-list"></div>
    </div>
  </section>

  <section id="publications" class="block">
    <div class="wrap">
      <div class="sec-head reveal"><div class="sec-title"><span class="num"></span><h2>Publications</h2></div></div>
      <ol class="pubs reveal" id="pub-list"></ol>
    </div>
  </section>

  <section id="projects" class="block tint">
    <div class="wrap">
      <div class="sec-head reveal">
        <div class="sec-title"><span class="num"></span><h2>Projects</h2></div>
        <div class="filters" id="filters" role="group" aria-label="Filter projects"></div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section id="skills" class="block">
    <div class="wrap">
      <div class="sec-head reveal"><div class="sec-title"><span class="num"></span><h2>Skills</h2></div></div>
      <div class="skill-groups reveal" id="skill-list"></div>
    </div>
  </section>

  <section id="impact" class="block tint">
    <div class="wrap">
      <div class="sec-head reveal"><div class="sec-title"><span class="num"></span><h2>Impact</h2></div></div>
      <div class="impact reveal" id="impact-list"></div>
    </div>
  </section>

  <section id="contact" class="block">
    <div class="wrap reveal">
      <div class="sec-head"><div class="sec-title"><span class="num"></span><h2>Contact</h2></div></div>
      <p class="hello">Have a question or an opportunity? Send me an email.</p>
      <a class="big-mail" id="big-mail"></a>
      <div class="contact-row">
        <button class="btn solid" id="copy" type="button">Copy email</button>
        <a class="btn" id="cv" target="_blank" rel="noopener" hidden>Download CV</a>
        <span class="toast" id="toast" role="status"></span>
      </div>
      <div class="contact-info" id="contact-info"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span id="copyright"></span>
    <a href="#home">Back to top</a>
  </div>
</footer>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const list = a => Array.isArray(a) ? a : [];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  document.title = `${SITE.name} | ${SITE.role}`;
  $("brand").textContent = SITE.shortName || SITE.name;

  /* ---------- which sections have content ---------- */
  const sections = [
    {id:"home",         label:"Home",         on:true},
    {id:"biography",    label:"Biography",    on:list(SITE.biography).length || list(SITE.timeline).length},
    {id:"research",     label:"Research",     on:list(SITE.research).length},
    {id:"publications", label:"Publications", on:list(SITE.publications).length},
    {id:"projects",     label:"Projects",     on:list(SITE.projects).length},
    {id:"skills",       label:"Skills",       on:list(SITE.skills).length},
    {id:"impact",       label:"Impact",       on:list(SITE.impact).length},
    {id:"contact",      label:"Contact",      on:true}
  ].filter(s => { if (!s.on) $(s.id).hidden = true; return s.on; });

  sections.forEach((s, n) => {
    const numEl = document.querySelector(`#${s.id} .sec-title .num`);
    if (numEl) numEl.textContent = String(n + 1).padStart(2, "0");
  });

  /* ---------- menu ---------- */
  const menu = $("menu"), btn = $("menu-btn");
  $("menu-list").innerHTML = sections.map((s, n) =>
    `<li style="transition-delay:${0.18 + n * 0.05}s"><a href="#${s.id}"><span class="num">${String(n+1).padStart(2,"0")}</span><span class="lbl">${s.label}</span></a></li>`
  ).join("");
  function setMenu(open){
    menu.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", open);
    btn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
    document.body.classList.toggle("locked", open);
    menu.querySelectorAll("li").forEach((li, n) => li.style.transitionDelay = open ? (0.18 + n * 0.05) + "s" : "0s");
    if (open) setTimeout(() => menu.querySelector("a")?.focus({preventScroll:true}), 350);
  }
  btn.addEventListener("click", () => setMenu(!menu.classList.contains("open")));
  menu.addEventListener("click", e => { if (e.target.closest("a")) setMenu(false); });
  addEventListener("keydown", e => { if (e.key === "Escape" && menu.classList.contains("open")) { setMenu(false); btn.focus(); } });

  /* ---------- hero ---------- */
  $("hello").textContent = `Hi, I'm based in ${SITE.location}`;
  const h1 = $("hero-name");
  h1.setAttribute("aria-label", SITE.name);
  let i = 0;
  SITE.name.split(" ").forEach((w, wi, arr) => {
    const word = document.createElement("span");
    word.className = "word"; word.setAttribute("aria-hidden", "true");
    [...w].forEach(ch => {
      const s = document.createElement("span");
      s.className = "ch"; s.textContent = ch;
      s.style.animationDelay = (0.15 + i++ * 0.04) + "s";
      word.appendChild(s);
    });
    h1.appendChild(word);
    if (wi < arr.length - 1) h1.appendChild(document.createTextNode(" "));
  });
  const after = 0.15 + i * 0.04 + 0.2;
  $("hero-role").textContent = SITE.role;
  $("hero-role").style.animationDelay = after + "s";
  $("hero-intro").textContent = SITE.intro;
  $("hero-intro").style.animationDelay = (after + 0.12) + "s";
  $("hero-actions").style.animationDelay = (after + 0.24) + "s";
  if (SITE.photo) { const p = $("photo"); p.src = SITE.photo; p.alt = SITE.name; p.hidden = false; p.style.animationDelay = after + "s"; }

  /* ---------- biography ---------- */
  $("bio-text").innerHTML = list(SITE.biography).map(p => `<p>${esc(p)}</p>`).join("");
  $("timeline").innerHTML = list(SITE.timeline).map(x => `<li>
      <span class="period">${esc(x.period)}</span>
      <h3>${esc(x.title)}</h3><span class="place">${esc(x.place)}</span>
      ${x.text ? `<p>${esc(x.text)}</p>` : ""}
    </li>`).join("");

  /* ---------- research ---------- */
  $("research-list").innerHTML = list(SITE.research).map(r =>
    `<article class="r-card"><h3>${esc(r.title)}</h3><p>${esc(r.text)}</p></article>`).join("");

  /* ---------- publications ---------- */
  $("pub-list").innerHTML = list(SITE.publications).map(p => `<li>
      <span class="year">${esc(p.year)}</span>
      <div>
        <h3>${p.link ? `<a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.title)}</a>` : esc(p.title)}</h3>
        <p class="authors">${esc(p.authors)}</p>
        <p class="venue">${esc(p.venue)}</p>
        ${p.link ? `<div class="links"><a href="${esc(p.link)}" target="_blank" rel="noopener">Read paper</a></div>` : ""}
      </div>
    </li>`).join("");

  /* ---------- projects ---------- */
  const palette = [["#E3F2EE","#0E7C66"],["#EAEFFC","#2F4FB5"],["#FDF0E4","#B4561A"],["#F2ECFA","#6B3FA0"],["#FCEBEE","#B23A55"],["#EDF5E1","#4E7A1E"]];
  const grid = $("grid");
  grid.innerHTML = list(SITE.projects).map((p, n) => {
    const [bg, fg] = palette[n % palette.length];
    const cover = p.image
      ? `<img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy">`
      : `<div class="gen" style="background:${bg};color:${fg}" aria-hidden="true">${esc(String(p.title).trim().charAt(0))}</div>`;
    const links = [
      p.live ? `<a href="${esc(p.live)}" target="_blank" rel="noopener">Live</a>` : "",
      p.code ? `<a href="${esc(p.code)}" target="_blank" rel="noopener">Code</a>` : ""
    ].join("");
    return `<article class="project" data-cat="${esc(p.category)}">
      <div class="cover">${cover}${p.category ? `<span class="cat">${esc(p.category)}</span>` : ""}</div>
      <h3>${esc(p.title)}</h3>
      <p>${esc(p.description)}</p>
      <div class="tags">${list(p.tags).map(t=>`<span>${esc(t)}</span>`).join("")}</div>
      ${links ? `<div class="links">${links}</div>` : ""}
    </article>`;
  }).join("");
  const cards = [...grid.children];
  const cats = ["All", ...new Set(list(SITE.projects).map(p => p.category).filter(Boolean))];
  const filters = $("filters");
  if (cats.length > 2) {
    filters.innerHTML = cats.map(c => `<button type="button" aria-pressed="${c==="All"}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
  } else filters.hidden = true;
  function showCards(items){
    items.forEach((el, k) => {
      if (reduce || !el.animate) return;
      el.animate([{opacity:0, transform:"translateY(28px)"}, {opacity:1, transform:"none"}],
        {duration:600, delay:k*90, easing:"cubic-bezier(.2,.8,.2,1)", fill:"both"});
    });
  }
  filters.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    filters.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    const c = b.dataset.cat, visible = [];
    cards.forEach(el => { const on = c === "All" || el.dataset.cat === c; el.hidden = !on; if (on) visible.push(el); });
    showCards(visible);
  });

  /* ---------- skills ---------- */
  $("skill-list").innerHTML = list(SITE.skills).map(g => `<div>
      <h3>${esc(g.group)}</h3>
      <div class="chips">${list(g.items).map(s => `<span>${esc(s)}</span>`).join("")}</div>
    </div>`).join("");

  /* ---------- impact ---------- */
  $("impact-list").innerHTML = list(SITE.impact).map(x => `<div>
      ${x.number ? `<div class="big">${esc(x.number)}</div>` : ""}
      <h3>${esc(x.title)}</h3><p>${esc(x.text)}</p>
    </div>`).join("");

  /* ---------- contact ---------- */
  const mail = $("big-mail");
  mail.textContent = SITE.email; mail.href = "mailto:" + SITE.email;
  $("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(SITE.email); }
    catch { const t = document.createElement("textarea"); t.value = SITE.email; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
    const toast = $("toast"); toast.textContent = "Email copied"; toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1800);
  });
  if (SITE.cv) { const cv = $("cv"); cv.href = SITE.cv; cv.hidden = false; }
  const info = [];
  if (SITE.phone) info.push(`<div><span>Phone</span><a href="tel:${esc(SITE.phone.replace(/\s/g,""))}">${esc(SITE.phone)}</a></div>`);
  if (SITE.location) info.push(`<div><span>Location</span><strong>${esc(SITE.location)}</strong></div>`);
  list(SITE.socials).forEach(s => info.push(`<div><span>${esc(s.label)}</span><a href="${esc(s.url)}" target="_blank" rel="noopener">View profile</a></div>`));
  $("contact-info").innerHTML = info.join("");
  $("copyright").textContent = `© ${new Date().getFullYear()} ${SITE.name}`;

  /* ---------- scroll animations ---------- */
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
  }, {threshold:.12});
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));

  if (!reduce && Element.prototype.animate && cards.length) {
    cards.forEach(c => c.style.opacity = 0);
    const gio = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting) { showCards(cards); gio.disconnect(); }
    }, {threshold:.1});
    gio.observe(grid);
  }

  const topbar = $("topbar");
  addEventListener("scroll", () => topbar.classList.toggle("scrolled", scrollY > 10), {passive:true});
})();
</script>
</body>
</html>
